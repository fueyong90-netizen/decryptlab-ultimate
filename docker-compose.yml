# Self-host (your PC, a home server, an Oracle Always-Free VM...).
#   docker compose up -d --build   ->  http://localhost:8090
services:
  decryptlab:
    build: .
    image: decryptlab-ultimate:latest
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
    restart: unless-stopped
  # Optional Telegram bot (set your token to enable).
  telegram:
    image: python:3.12-slim
    depends_on: [decryptlab]
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - DLU_TOKEN=${DLU_TOKEN:-}
      - DLU_BIN=/app/build/bin/decryptlab
    command: ["python3", "apps/telegram/bot.py"]
    restart: unless-stopped
    profiles: ["telegram"]
