# Fly.io free allowance. Install flyctl, then: fly launch --copy-config --now
app = "decryptlab-ultimate"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/api/health"
  interval = "30s"
  timeout = "5s"

[env]
  PORT = "8090"
